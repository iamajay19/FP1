[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = ".deps/phase2-vendor"

[net]
offline = true

[build]
# Cargo passes actual rustc argv, including cargo rustc's per-crate extra flags.
rustc-wrapper = "scripts/guard_rustc.py"
# Guard actual rustdoc arguments, including --config overrides not exposed to
# build.rs. Toolchain/PATH remain trusted build inputs.
rustdoc = "scripts/guard_rustdoc.py"
# Applies to dependencies too. A root-only rustc-cfg cannot select getrandom's backend.
rustflags = ["--cfg", 'getrandom_backend="linux_getrandom"']
# Rustdoc recompiles the crate for doctests and does not inherit rustflags.
rustdocflags = ["--cfg", 'getrandom_backend="linux_getrandom"']
